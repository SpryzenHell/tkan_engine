name: tkan-engine-a100-validation

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Measured training steps per run"
        required: true
        default: "20"
      warmup:
        description: "Warmup steps before timing"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  a100-validation:
    # These labels must match the self-hosted A100 runner registration.
    runs-on: [self-hosted, Linux, X64, gpu, a100]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify GPU and software environment
        run: |
          set -euo pipefail
          nvidia-smi
          python - <<'PY'
          import json, torch
          assert torch.cuda.is_available(), "CUDA is not available in this runner's PyTorch"
          count = torch.cuda.device_count()
          assert count >= 1, "No CUDA devices are visible"
          print(json.dumps({
              "torch": torch.__version__,
              "cuda_runtime": torch.version.cuda,
              "visible_gpus": count,
              "devices": [torch.cuda.get_device_name(i) for i in range(count)],
              "device_memory_bytes": [torch.cuda.get_device_properties(i).total_memory for i in range(count)],
          }, indent=2))
          PY
      - name: Install project test and plotting dependencies
        run: python -m pip install -e ".[full]"
      - name: Run the full test suite
        run: pytest --junitxml=results/a100-pytest.xml
      - name: Run warmed-up one-, two-, and four-GPU training measurements when available
        env:
          MEASURE_STEPS: ${{ inputs.steps }}
          WARMUP_STEPS: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p results/a100
          count=$(python -c "import torch; print(torch.cuda.device_count())")
          for ranks in 1 2 4; do
            if [ "$ranks" -le "$count" ]; then
              echo "Running with $ranks GPU(s)"
              torchrun --standalone --nproc_per_node="$ranks" scripts/ddp_benchmark.py \
                --distributed --events 32768 --seq-len 64 --features 15 \
                --hidden 48 --depth 2 --grid-size 8 --batch-size 128 \
                --warmup "$WARMUP_STEPS" --steps "$MEASURE_STEPS" \
                --out "results/a100/ddp-${ranks}gpu.json"
            fi
          done
      - name: Profile CUDA operators and record unprofiled throughput
        run: |
          set -euo pipefail
          python scripts/profile_gpu.py --batch 128 --seq-len 64 --features 15 \
            --hidden 48 --steps 10 --measure-steps 30 --warmup 5 \
            --out results/a100/gpu_profile.txt \
            --metrics-out results/a100/gpu_profile_metrics.json
      - name: Collect Nsight Compute hardware counters when available
        continue-on-error: true
        run: |
          set -uo pipefail
          if command -v ncu >/dev/null 2>&1; then
            ncu --version | tee results/a100/ncu-version.txt
            ncu --set basic --target-processes all --force-overwrite \
              -o results/a100/ncu-basic \
              python scripts/profile_gpu.py --batch 64 --seq-len 32 --features 15 \
                --hidden 32 --steps 2 --measure-steps 3 --warmup 2 \
                --out results/a100/ncu-profile.txt \
                --metrics-out results/a100/ncu-profile-metrics.json
          else
            echo "Nsight Compute (ncu) is not installed; no hardware-counter arithmetic-intensity result was collected." \
              | tee results/a100/ncu-unavailable.txt
          fi
      - name: Upload measured GPU results
        uses: actions/upload-artifact@v4
        with:
          name: tkan-engine-a100-validation-${{ github.run_id }}
          path: |
            results/a100/
            results/a100-pytest.xml
          if-no-files-found: error
