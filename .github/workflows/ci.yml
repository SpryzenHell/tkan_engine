name: tkan-ci

concurrency:
  group: tkan-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full]"
      - run: pytest --junitxml=results/pytest-results.xml
      - name: Save Python-version test report
        uses: actions/upload-artifact@v4
        with:
          name: tkan-test-results-${{ matrix.python-version }}
          path: results/pytest-results.xml
          if-no-files-found: error
      - run: python scripts/inversion_benchmark.py --events 3000 --epochs 5 --batch-size 128 --hidden 16 --grid-size 6
      - name: Save measured inversion result
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: tkan-inversion-single-run
          path: results/inversion_benchmark.json
          if-no-files-found: error

  arrow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "pyarrow>=25,<27"
      - run: python scripts/benchmark_arrow.py --events 5000000 --batch-size 250000
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-arrow-5m
          path: results/arrow_benchmark.json
          if-no-files-found: error

  arrow-300m:
    runs-on: ubuntu-latest
    needs: arrow-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "pyarrow>=25,<27"
      - run: python scripts/benchmark_arrow.py --events 300000000 --batch-size 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-arrow-300m
          path: results/arrow_benchmark.json
          if-no-files-found: error

  ddp-cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full]"
      - run: torchrun --standalone --nproc_per_node=2 scripts/ddp_benchmark.py --distributed --events 10000 --steps 10 --batch-size 128
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-ddp-cpu
          path: results/ddp_benchmark.json
          if-no-files-found: error

  experiment-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full]"
      - name: Run seed and noise sensitivity sweep
        run: |
          python scripts/inversion_sweep.py --events 3000 --epochs 5 --batch-size 128 --hidden 16 --grid-size 6 --seeds 123,321,456 --noise-levels 0.04,0.08,0.16 --out results/inversion_sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-inversion-sweep
          path: results/inversion_sweep.json
          if-no-files-found: error

  report:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Refresh benchmark plots')
    runs-on: ubuntu-latest
    needs: [test, arrow-smoke, arrow-300m, ddp-cpu-smoke, experiment-sweep]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download measured inversion result
        uses: actions/download-artifact@v4
        with:
          name: tkan-inversion-single-run
          path: results/raw/inversion
      - name: Download inversion sensitivity sweep
        uses: actions/download-artifact@v4
        with:
          name: tkan-inversion-sweep
          path: results/raw/sweep
      - name: Download fresh Arrow 5M result
        uses: actions/download-artifact@v4
        with:
          name: tkan-arrow-5m
          path: results/raw/arrow5m
      - name: Download fresh Arrow 300M result
        uses: actions/download-artifact@v4
        with:
          name: tkan-arrow-300m
          path: results/raw/arrow300m
      - name: Download fresh CPU DDP result
        uses: actions/download-artifact@v4
        with:
          name: tkan-ddp-cpu
          path: results/raw/ddp
      - name: Download Python 3.10 test report
        uses: actions/download-artifact@v4
        with:
          name: tkan-test-results-3.10
          path: results/raw/tests/3.10
      - name: Download Python 3.11 test report
        uses: actions/download-artifact@v4
        with:
          name: tkan-test-results-3.11
          path: results/raw/tests/3.11
      - name: Download Python 3.12 test report
        uses: actions/download-artifact@v4
        with:
          name: tkan-test-results-3.12
          path: results/raw/tests/3.12
      - name: Save the measured experiment inputs used by the report
        env:
          CI_RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pairs = [
              ("results/raw/inversion/inversion_benchmark.json", "results/ci_inversion_3000.json"),
              ("results/raw/sweep/inversion_sweep.json", "results/inversion_sweep.json"),
              ("results/raw/arrow5m/arrow_benchmark.json", "results/arrow_benchmark_5m.json"),
              ("results/raw/arrow300m/arrow_benchmark.json", "results/arrow_benchmark_300m.json"),
              ("results/raw/ddp/ddp_benchmark.json", "results/ddp_benchmark_cpu.json"),
          ]
          for source, target in pairs:
              data = json.loads(Path(source).read_text(encoding="utf-8"))
              data["ci_run_id"] = int(os.environ["CI_RUN_ID"])
              data["source_commit"] = os.environ["SOURCE_COMMIT"]
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              Path(target).write_text(json.dumps(data, indent=2), encoding="utf-8")

          versions = {}
          for version in ("3.10", "3.11", "3.12"):
              xml_path = Path(f"results/raw/tests/{version}/pytest-results.xml")
              root = ET.parse(xml_path).getroot()
              suites = [node for node in root.iter() if node.tag == "testsuite"]
              tests = sum(int(node.attrib.get("tests", 0)) for node in suites)
              failures = sum(int(node.attrib.get("failures", 0)) for node in suites)
              errors = sum(int(node.attrib.get("errors", 0)) for node in suites)
              skipped = sum(int(node.attrib.get("skipped", 0)) for node in suites)
              versions[version] = {
                  "tests": tests,
                  "passed": tests - failures - errors - skipped,
                  "skipped": skipped,
                  "failures": failures,
                  "errors": errors,
              }
          matrix = {
              "ci_run_id": int(os.environ["CI_RUN_ID"]),
              "source_commit": os.environ["SOURCE_COMMIT"],
              "python_versions": versions,
          }
          Path("results/test_matrix.json").write_text(
              json.dumps(matrix, indent=2), encoding="utf-8"
          )
          PY
      - run: python -m pip install "matplotlib>=3.8"
      - run: python scripts/render_report.py
      - run: python scripts/update_experiment_report.py
      - name: Check all twelve plots
        run: |
          set -euo pipefail
          for plot in inversion_rmse inversion_ic inversion_loss arrow_300m arrow_runtime arrow_batches model_tradeoff ddp_cpu inversion_noise_rmse inversion_noise_ic inversion_seed_rmse inversion_rmse_gain; do
            test -s "docs/figures/${plot}.svg"
            test -s "results/figures/${plot}.png"
          done
      - name: Commit regenerated plots
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "Pirate-Emperor"
          git config user.email "116669078+Pirate-Emperor@users.noreply.github.com"
          git add README.md docs/EXPERIMENTS.md docs/BENCHMARK_STATUS.md results/ci_inversion_3000.json results/inversion_sweep.json results/test_matrix.json docs/figures/inversion_rmse.svg docs/figures/inversion_ic.svg docs/figures/inversion_loss.svg docs/figures/arrow_300m.svg docs/figures/arrow_runtime.svg docs/figures/arrow_batches.svg docs/figures/model_tradeoff.svg docs/figures/ddp_cpu.svg docs/figures/inversion_noise_rmse.svg docs/figures/inversion_noise_ic.svg docs/figures/inversion_seed_rmse.svg docs/figures/inversion_rmse_gain.svg
          if git diff --cached --quiet; then
            echo "Plot files are already current."
          else
            git commit -m "Refresh benchmark plots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-benchmark-plots-${{ github.sha }}
          path: results/figures/*.png
          if-no-files-found: error
